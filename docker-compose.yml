name: pkg-cache

services:
  origin:
    build: ./origin
    environment:
      PKG_DIR: /data/packages
    volumes:
      - origin-data:/data/packages
    ports:
      - "8081:8000"   # origin control API: /control/*, /docs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  proxy:
    build: ./proxy
    environment:
      ORIGIN_BASE_URL: http://origin:8000
      CACHE_DIR: /cache
    volumes:
      - proxy-cache:/cache   # complete packages survive restarts
    ports:
      - "8080:8000"          # download API + /docs (verified download, purge)
    depends_on:
      origin:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  origin-data:
  proxy-cache:
